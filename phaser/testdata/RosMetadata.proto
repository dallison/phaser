syntax = "proto3";

package example_msgs.proto;

import "phaser/options.proto";
import "google/protobuf/timestamp.proto";

message Status {
  enum Constants {
    option (phaser.ros_enum) = {
      type: "int32"
    };

    CONSTANTS_OK = 0;
    CONSTANTS_BAD = 1;
  }

  int32 value = 1;
}

message Bool {
  bool data = 1;
}

message Wrapper {
  enum Constants {
    option (phaser.ros_enum) = {
      type: "uint8"
    };

    CONSTANTS_UNSPECIFIED = 0 [(phaser.ros_enum_value) = { ignore: true }];
    READY = 1;
  }

  Bool child = 1;
  repeated int32 samples = 2 [(phaser.array_size) = 3];
  Status status = 3;
  bool ready = 4;
  google.protobuf.Timestamp stamp = 5;
  repeated google.protobuf.Timestamp stamps = 6;
}

enum LegacyStatus {
  option (phaser.ros_enum) = {
    type: "uint8"
  };

  LEGACY_STATUS_OK = 0;
}

message LegacyStatusWrapper {
  LegacyStatus status = 1 [(phaser.ros_field) = {
    type: "example_msgs/LegacyStatus"
    nested_data_type: "example_msgs/LegacyStatus"
    nested_md5_text: "uint8 OK=0"
    nested_source_definition: "# Legacy status.\nuint8 OK = 0\n"
  }];
}
