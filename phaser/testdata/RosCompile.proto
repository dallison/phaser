syntax = "proto3";

package foo.bar;

import "phaser/options.proto";

enum RosColor {
  ROS_COLOR_UNSPECIFIED = 0;
  ROS_COLOR_RED = 1;
  ROS_COLOR_BLUE = 2;
}

enum RosConstantOnly {
  ROS_CONSTANT_ONLY_UNSPECIFIED = 0;
  ROS_CONSTANT_ONLY_FIRST = 1;
  ROS_CONSTANT_ONLY_SECOND = 2;
}

message RosConstantOnlyHolder {
  RosConstantOnly marker = 1 [(phaser.ros_field) = {
    type: "example_msgs/Marker"
    nested_data_type: "example_msgs/Marker"
    nested_md5_text: "uint8 FIRST=1\nuint8 SECOND=2"
  }];
  uint32 value = 2;
}

message RosInner {
  int32 id = 1;
}

message RosDefinitionMetadata {
  option (phaser.ros_message) = {
    data_type: "example_msgs/RosDefinitionMetadata"
    source_definition: "# Original comment\n\nint32 value\n"
  };
  int32 value = 1;
}

message RosCompileMessage {
  int32 x = 1;
  string name = 2;
  bool flag = 3;
  double value = 4;
  RosColor color = 5;
  RosInner inner = 6;
  repeated int32 xs = 7;
  repeated string names = 8;
  repeated RosColor colors = 9;
  repeated RosInner inners = 10;

  repeated int32 fixed_ints = 11 [(phaser.array_size) = 4];
  repeated RosColor fixed_colors = 12 [(phaser.array_size) = 3];
  repeated string fixed_names = 13 [(phaser.array_size) = 2];
  repeated RosInner fixed_inners = 14 [(phaser.array_size) = 2];

  oneof choice {
    int32 choice_count = 15;
    int32 choice_code = 16;
    string choice_name = 17;
    RosInner choice_inner = 18;
  }
}

message RosPackedFixedMessage {
  repeated fixed32 fixed32_values = 1;
  repeated sfixed32 sfixed32_values = 2;
  repeated float float_values = 3;
  repeated fixed64 fixed64_values = 4;
  repeated sfixed64 sfixed64_values = 5;
  repeated double double_values = 6;
  repeated fixed64 fixed_array = 7 [(phaser.array_size) = 3];
}

message RosNarrowScalars {
  uint32 uint8_value = 1 [(phaser.ros_field) = { type: "uint8" }];
  int32 int8_value = 2 [(phaser.ros_field) = { type: "int8" }];
  uint32 uint16_value = 3 [(phaser.ros_field) = { type: "uint16" }];
  int32 int16_value = 4 [(phaser.ros_field) = { type: "int16" }];
}

// These names have all been used by generated method parameters or local
// variables. They must remain usable as unmodified ROS frontend field names.
message GeneratorNameCollisions {
  int32 status = 1;
  uint32 size = 2;
  string buffer = 3;
  bool other = 4;
  int32 indent = 5;
  repeated int32 i = 6;
  string source = 7;
  string destination = 8;
  string message = 9;
  string input = 10;
  string output = 11;
  uint32 tag = 12;
  uint32 field_number = 13;
  uint32 count = 14;
  string data = 15;
  string value = 16;
}
