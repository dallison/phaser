syntax = "proto3";

package foo.bar.coverage;

import "phaser/testdata/Foo.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum CoverageEnum {
  COV_UNSET = 0;
  COV_FOO = 0xda;
  COV_BAR = 0xad;
}

message AllScalars {
  int32 f_int32 = 1;
  int64 f_int64 = 2;
  sint32 f_sint32 = 3;
  sint64 f_sint64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  fixed32 f_fixed32 = 7;
  fixed64 f_fixed64 = 8;
  sfixed32 f_sfixed32 = 9;
  sfixed64 f_sfixed64 = 10;
  float f_float = 11;
  double f_double = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  CoverageEnum f_enum = 16;
}

message MapHolder {
  map<string, int32> values = 1;
}

message RepeatedPrimitivesPacked {
  repeated int32 vi32 = 1 [packed = true];
  repeated int64 vi64 = 2 [packed = true];
  repeated fixed64 vf64 = 3 [packed = true];
}

message RepeatedPrimitivesUnpacked {
  repeated int32 vi32 = 1 [packed = false];
}

message RepeatedStrings {
  repeated string vstr = 1;
}

message RepeatedBytes {
  repeated bytes vbytes = 1;
}

message RepeatedMessages {
  repeated AllScalars items = 1;
}

message OneofStress {
  oneof u {
    int32 u_int = 1;
    string u_string = 2;
    AllScalars u_msg = 3;
    bytes u_bytes = 4;
  }
}

message CoverageInner {
  string str = 1;
  fixed64 f = 2;
}

message ImportsMessage {
  foo.bar.Foo imported_foo = 1;
  google.protobuf.Any any_field = 2;
  google.protobuf.Timestamp timestamp = 3;
  google.protobuf.StringValue wrapped_string = 4;
  google.protobuf.Empty empty_msg = 5;
  CoverageInner inner = 6;
}
