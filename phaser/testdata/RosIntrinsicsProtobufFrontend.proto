syntax = "proto3";

package foo.bar.pb;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "phaser/options.proto";
import "phaser/testdata/RosHeader.proto";

message WireChild {
  int32 id = 1;
  string label = 2;
}

message RosIntrinsicMessage {
  google.protobuf.Timestamp stamp = 1;
  google.protobuf.Duration timeout = 2;
  std_msgs.Header header = 3;
  int32 count = 4;
  string name = 5;
  repeated int32 samples = 6;
  repeated string tags = 7;
  repeated WireChild children = 8;
  repeated string fixed_names = 9 [(phaser.array_size) = 2];
  repeated WireChild fixed_children = 10 [(phaser.array_size) = 2];

  oneof choice {
    int32 choice_number = 11;
    string choice_text = 12;
    WireChild choice_child = 13;
  }

  repeated google.protobuf.Timestamp stamps = 14;
  repeated google.protobuf.Duration timeouts = 15;
  repeated google.protobuf.Timestamp fixed_stamps = 16
      [(phaser.array_size) = 2];
  repeated google.protobuf.Duration fixed_timeouts = 17
      [(phaser.array_size) = 2];
}

message StampedChild {
  google.protobuf.Timestamp stamp = 1;
  std_msgs.Header header = 2;
}

enum DirectKind {
  DIRECT_KIND_UNSPECIFIED = 0;
  DIRECT_KIND_FIRST = 1;
  DIRECT_KIND_SECOND = 2;
}

// The protobuf frontend's twin of DirectElement in RosIntrinsics.proto, with
// its nested messages stored through offsets.
message DirectElement {
  int32 id = 1;
  string label = 2;
  bool flag = 3;
  double value = 4;
  uint64 big = 5;
  uint32 small = 6 [(phaser.ros_field) = { type: "uint8" }];
  int32 level = 7 [(phaser.ros_field) = { type: "int16" }];
  float ratio = 8;
  DirectKind kind = 9;
  bytes blob = 10;
  google.protobuf.Timestamp stamp = 11;
  google.protobuf.Duration timeout = 12;
  std_msgs.Header header = 13;
  WireChild child = 14;
  repeated int32 samples = 15;
  repeated uint32 octets = 16 [(phaser.ros_field) = { type: "uint8" }];
  repeated bool flags = 17;
  repeated DirectKind kinds = 18;
  repeated string tags = 19;
  repeated WireChild children = 20;
  repeated google.protobuf.Timestamp stamps = 21;
  repeated google.protobuf.Duration timeouts = 22;
  repeated StampedChild stamped = 23;
  repeated DirectElement nested = 24;
}

// Elements that ROS parsing writes straight into the payload: one with only
// fixed-size fields and one with strings.
message DirectFixedLeaf {
  int32 id = 1;
  bool flag = 2;
  double value = 3;
  uint64 big = 4;
  uint32 small = 5 [(phaser.ros_field) = { type: "uint8" }];
  int32 level = 6 [(phaser.ros_field) = { type: "int16" }];
  float ratio = 7;
  DirectKind kind = 8;
  sint64 delta = 9;
}

message DirectLeaf {
  string name = 1;
  uint32 count = 2;
  bytes payload = 3;
  DirectKind kind = 4;
}

message DirectElements {
  repeated DirectElement elements = 1;
  repeated RosIntrinsicMessage handled = 2;
  repeated DirectFixedLeaf fixed_leaves = 3;
  repeated DirectLeaf leaves = 4;
}
