name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and run every test target except perf_test.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-test-${{ matrix.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            bazel-disk-test-${{ matrix.os }}-

      # Apple Silicon runners need the apple_silicon config (adds -arch arm64),
      # which must not be applied on Linux.
      - name: Select macOS config
        if: runner.os == 'macOS'
        run: echo "EXTRA_CONFIG=--config=apple_silicon" >> "$GITHUB_ENV"

      - name: Test (everything except perf_test)
        run: |
          bazel test --disk_cache="$HOME/.cache/bazel-disk" $EXTRA_CONFIG \
            --test_tag_filters=-linux_arm32 \
            -- //... -//phaser:perf_test

  # The CMake build.  The smoke test project generates a library with each
  # frontend, compiles the Rust bindings and runs a program that links both.
  # The policy minimum lets CMake 4 configure dependencies that declare an
  # older one.
  cmake:
    name: cmake (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S cmake/smoke_test -B build/cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build/cmake --parallel 4

      - name: Test
        run: ctest --test-dir build/cmake --output-on-failure

  # AddressSanitizer runs on macOS (Apple Silicon).
  asan:
    name: asan (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-asan-macos-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            bazel-disk-asan-macos-

      - name: Test with ASan (everything except perf_test)
        run: |
          bazel test --disk_cache="$HOME/.cache/bazel-disk" \
            --config=asan --config=apple_silicon \
            --test_tag_filters=-linux_arm32 \
            -- //... -//phaser:perf_test

  # AddressSanitizer runs on Linux (no apple_silicon config).
  asan-linux:
    name: asan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-asan-linux-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            bazel-disk-asan-linux-

      - name: Test with ASan (everything except perf_test)
        run: |
          bazel test --disk_cache="$HOME/.cache/bazel-disk" \
            --config=asan \
            --test_tag_filters=-linux_arm32 \
            -- //... -//phaser:perf_test

  # Valgrind (memcheck) runs on Linux only.
  valgrind:
    name: valgrind (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-valgrind-linux-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            bazel-disk-valgrind-linux-

      - name: Test under Valgrind (everything except perf_test)
        run: |
          bazel test --disk_cache="$HOME/.cache/bazel-disk" --config=valgrind \
            --test_tag_filters=-linux_arm32 \
            -- //... -//phaser:perf_test

  # Cross-build phaser_runtime for armhf and smoke-test under QEMU user emulation.
  arm32:
    name: arm32 (Linux armhf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf
          # ubuntu-24.04: qemu-user-static; ubuntu-latest (26.04): qemu-user-binfmt.
          sudo apt-get install -y qemu-user-static \
            || sudo apt-get install -y qemu-user-binfmt

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-arm32-linux-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            bazel-disk-arm32-linux-

      - name: Build and test (armhf)
        run: |
          chmod +x scripts/build-armhf-linux.sh
          scripts/build-armhf-linux.sh --test
