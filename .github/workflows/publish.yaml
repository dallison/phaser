name: Publish to BCR

# Mirrors each GitHub release of Phaser to the Bazel Central Registry by
# opening a pull request against bazelbuild/bazel-central-registry. The entry
# is generated from the templates in the .bcr/ folder of this repository.
#
# Phaser's source MODULE.bazel intentionally keeps the repository name
# "phaser", while the existing BCR module is named "phaser_zc_protobuf". The
# publisher determines the destination directory before applying BCR patches,
# so an ephemeral symlink directs generation into the existing module. The
# patch then changes the published MODULE.bazel without changing this repo.
#
# One-time setup required for this to work:
#   * A fork of bazelbuild/bazel-central-registry must exist at
#     dallison/bazel-central-registry (this is where the PR branch is pushed).
#   * A repository secret named BCR_PUBLISH_TOKEN must contain a *classic*
#     Personal Access Token (fine-grained PATs cannot open pull requests
#     against public repositories) with the "repo" and "workflow" scopes, able
#     to push to the fork and open a PR against bazelbuild/bazel-central-registry.

on:
  release:
    types: [published]
  # Allow re-publishing a specific existing tag by hand, e.g. to retry after a
  # transient failure or after fixing the .bcr templates.
  workflow_dispatch:
    inputs:
      tag_name:
        description: The release tag to publish to the BCR (e.g. 2.1.0)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REGISTRY: bazelbuild/bazel-central-registry
      REGISTRY_FORK: dallison/bazel-central-registry
      MODULE_NAME: phaser_zc_protobuf
      SOURCE_MODULE_NAME: phaser
      TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - name: Checkout Phaser
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}
          path: phaser
          persist-credentials: false

      - name: Checkout BCR
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REGISTRY }}
          path: bazel-central-registry
          persist-credentials: false

      - name: Determine release version
        env:
          TAG: ${{ env.TAG_NAME }}
        run: |
          set -o errexit -o nounset -o pipefail
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # publish-to-bcr reads the unpatched source module name before it applies
      # .bcr/patches. Point that name at the existing BCR module temporarily.
      - name: Alias the existing BCR module
        working-directory: bazel-central-registry/modules
        run: |
          set -o errexit -o nounset -o pipefail
          test ! -e "${SOURCE_MODULE_NAME}"
          test -d "${MODULE_NAME}"
          ln -s "${MODULE_NAME}" "${SOURCE_MODULE_NAME}"

      - name: Generate BCR entry
        uses: bazel-contrib/publish-to-bcr@v1.4.2
        with:
          tag: ${{ env.TAG_NAME }}
          module-version: ${{ env.VERSION }}
          local-registry: bazel-central-registry
          templates-dir: phaser/.bcr

      - name: Remove temporary module alias
        if: always()
        working-directory: bazel-central-registry/modules
        run: rm -f "${SOURCE_MODULE_NAME}"

      - name: Verify generated entry
        working-directory: bazel-central-registry
        run: |
          set -o errexit -o nounset -o pipefail
          ENTRY="modules/${MODULE_NAME}/${VERSION}"
          test -d "${ENTRY}"
          test ! -e "modules/${SOURCE_MODULE_NAME}"
          grep -Fq "name = \"${MODULE_NAME}\"" "${ENTRY}/MODULE.bazel"

      - name: Commit and push BCR entry
        id: push
        working-directory: bazel-central-registry
        env:
          PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          BRANCH="${MODULE_NAME}-${TAG_NAME}"
          git remote add fork "https://x-access-token:${PUBLISH_TOKEN}@github.com/${REGISTRY_FORK}.git"
          git checkout -b "${BRANCH}"
          git add "modules/${MODULE_NAME}"
          git -c "author.name=${GITHUB_ACTOR}" \
              -c "author.email=${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com" \
              -c "committer.name=github-actions[bot]" \
              -c "committer.email=41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "${MODULE_NAME}@${VERSION}"
          git push --force fork "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open BCR pull request
        env:
          PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -o errexit -o nounset -o pipefail
          FORK_OWNER="${REGISTRY_FORK%%/*}"
          BODY=$(printf 'Release: https://github.com/%s/releases/tag/%s\n\n_Automated by [Publish to BCR](https://github.com/bazel-contrib/publish-to-bcr)_' \
            "${GITHUB_REPOSITORY}" "${TAG_NAME}")
          REQUEST=$(jq --null-input \
            --arg title "${MODULE_NAME}@${VERSION}" \
            --arg body "${BODY}" \
            --arg head "${FORK_OWNER}:${BRANCH}" \
            '{title: $title, body: $body, head: $head, base: "main", draft: true, maintainer_can_modify: true}')
          RESPONSE=$(mktemp)
          STATUS=$(curl --location --silent --output "${RESPONSE}" --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PUBLISH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REGISTRY}/pulls" \
            --data "${REQUEST}")
          if [[ "${STATUS}" == 201 ]]; then
            jq --raw-output .html_url < "${RESPONSE}" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "${STATUS}" == 422 ]] && jq -e '.errors[0].message | contains("already exists")' < "${RESPONSE}" > /dev/null; then
            echo "A pull request for ${REGISTRY_FORK}:${BRANCH} already exists." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed to create pull request (HTTP ${STATUS})."
            jq . < "${RESPONSE}"
            exit 1
          fi
